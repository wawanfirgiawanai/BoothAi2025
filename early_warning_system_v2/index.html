<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>EWS ARIMA – Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Leaflet Draw -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css"/>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

  <!-- jStat -->
  <script src="https://cdn.jsdelivr.net/npm/jstat@1.9.5/dist/jstat.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header aplikasi -->
  <header class="appHeader">
    <h1>EWS ARIMA</h1>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="grafik.html">Grafik</a>
    </nav>
  </header>

  <!-- Layout utama -->
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div id="resizer"></div>
      <div class="panel">
        <!-- Upload CSV -->
        <section>
          <h2>Upload Data</h2>
          <input type="file" id="fileInput" accept=".csv"/>
          <p class="note">Format: station,date,rain_mm,lat,lon</p>
        </section>

        <!-- Parameter SPI -->
        <section>
          <h2>Analisis</h2>
          <label>SPI (k bulan)</label>
          <select id="spiK">
            <option value="1">SPI-1</option>
            <option value="3" selected>SPI-3</option>
            <option value="6">SPI-6</option>
            <option value="12">SPI-12</option>
          </select>

          <label>Ambang Kering (≤)</label>
          <input id="thrDry" type="number" step="0.1" value="-1">

          <label>Ambang Basah (≥)</label>
          <input id="thrWet" type="number" step="0.1" value="1">

          <label>Mode Data</label>
          <select id="mode">
            <option value="historis">Historis</option>
            <option value="prediksi">Prediksi (ARIMA)</option>
          </select>

          <label>Lead Prediksi (bulan)</label>
          <select id="lead">
            <option value="1">+1</option>
            <option value="2">+2</option>
            <option value="3">+3</option>
          </select>

          <button id="apply">Terapkan</button>
        </section>

        <!-- Tabel Risiko -->
        <section>
          <h2>Daftar Risiko</h2>
          
          <!-- 🔽 Dropdown filter baru -->
          <label>Filter Data</label>
          <select id="riskFilter">
            <option value="all">Semua</option>
            <option value="historis">Historis</option>
            <option value="prediksi">Prediksi</option>
          </select>

          <div class="tableWrap">
            <table id="riskTable">
              <thead>
                <tr>
                  <th>Stasiun</th>
                  <th>Bulan</th>
                  <th>Hujan (mm)</th>
                  <th>SPI</th>
                  <th>Status</th>
                  <th>Sumber</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <button id="exportCsv">Export CSV</button>
        </section>

        <!-- Polygon -->
        <section>
          <h2>Polygon</h2>
          <button id="exportPolygon">Export Polygon</button>
          <input type="file" id="importPolygon" accept=".geojson"/>
          <p class="note">Gunakan format GeoJSON</p>
        </section>
      </div>
    </aside>

    <!-- Main Map -->
    <main id="main">
      <div id="map"></div>
    </main>
  </div>

  <!-- JS -->
  <script src="app.js"></script>
</body>
</html>
