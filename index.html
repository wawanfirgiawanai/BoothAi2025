<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innovation Booth – Pusat Studi AI UNSULBAR</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #0d0d0d, #000);
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, #0a0a0a, #101820, #0a0a0a);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
      z-index: -2;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      text-align: center;
      backdrop-filter: blur(6px);
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
    }

    header h1 {
      font-size: 2.5em;
      font-weight: 700;
      color: #00bcd4;
      margin-bottom: 10px;
    }

    header p {
      color: #bbb;
      font-size: 1em;
      margin-bottom: 40px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .btn {
      display: inline-block;
      padding: 15px 25px;
      font-size: 1.1em;
      font-weight: 500;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(90deg, #0057ff, #00bcd4);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 188, 212, 0.3);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.07);
      box-shadow: 0 6px 25px rgba(0, 188, 212, 0.6);
    }

    footer {
      margin-top: 40px;
      font-size: 0.85em;
      color: #888;
    }

    /* Partikel animasi */
    .particle {
      position: fixed;
      background: rgba(0, 188, 212, 0.7);
      border-radius: 50%;
      z-index: -1;
      transition: transform 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <div class="container">
    <header>
      <h1>Innovation Booth</h1>
      <p>Pusat Studi Artificial Intelligence<br>Universitas Sulawesi Barat</p>
    </header>
    <main class="links">      
      <a href="http://localhost/BoothPameran2025//pagar-virtual" target="_blank" class="btn">
        🦬 Si-TernakApps
      </a>
      <a href="http://localhost/BoothPameran2025//early_warning_system_v2" target="_blank" class="btn">
        🚨 Early Warning System v2
      </a>
      <a href="http://localhost/BoothPameran2025//ResQVision" target="_blank" class="btn">
        🛰️ ResQVision
      </a>
      <a href="http://localhost/BoothPameran2025//webgis-fisherman-tracking" target="_blank" class="btn">
        🌊 WebGIS Fisherman Tracking
      </a>
    </main>

    <footer>
      <p>© 2025 Pusat Studi AI – Universitas Sulawesi Barat</p>
    </footer>
  </div>

  <script>
    // Efek partikel lembut untuk latar belakang
    const numParticles = 60;
    const particles = [];

    for (let i = 0; i < numParticles; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      document.body.appendChild(particle);
      particles.push({
        el: particle,
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 3 + 1,
        dx: (Math.random() - 0.5) * 0.8,
        dy: (Math.random() - 0.5) * 0.8,
      });
    }

    function animate() {
      particles.forEach(p => {
        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0 || p.x > window.innerWidth) p.dx *= -1;
        if (p.y < 0 || p.y > window.innerHeight) p.dy *= -1;

        p.el.style.left = p.x + 'px';
        p.el.style.top = p.y + 'px';
        p.el.style.width = p.size + 'px';
        p.el.style.height = p.size + 'px';
      });
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
